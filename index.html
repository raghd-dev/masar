<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASAR — Riyadh Metro</title>
  <meta name="description" content="MASAR is a modern Riyadh Metro companion for exploring routes, stations, journeys, and metro information.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

```
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #07131f;
  color: #ffffff;
  line-height: 1.6;
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  background:
    radial-gradient(circle at top, #173b52 0%, #07131f 55%);
}

.container {
  max-width: 850px;
}

.logo {
  width: 90px;
  height: 90px;
  margin: 0 auto 25px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  color: #07131f;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(48px, 9vw, 82px);
  letter-spacing: 8px;
  margin-bottom: 15px;
}

.tagline {
  font-size: clamp(20px, 4vw, 30px);
  margin-bottom: 20px;
  font-weight: 600;
}

.description {
  max-width: 650px;
  margin: 0 auto 35px;
  color: #c8d5df;
  font-size: 17px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

.button {
  display: inline-block;
  padding: 13px 24px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 700;
  background: #ffffff;
  color: #07131f;
}

.button.secondary {
  background: transparent;
  color: #ffffff;
  border: 1px solid #6e8798;
}

footer {
  margin-top: 55px;
  color: #8da1af;
  font-size: 14px;
}
```

  </style>
</head>

<body>
  <main class="hero">
    <div class="container">

```
  <div class="logo">M</div>

  <h1>MASAR</h1>

  <p class="tagline">Your Riyadh Metro Companion</p>

  <p class="description">
    MASAR is a modern mobile application designed to help users
    explore Riyadh Metro routes, stations, journeys, and
    transportation information in one convenient experience.
  </p>

  <div class="buttons">
    <a class="button" href="https://raghd-dev.github.io/masar-privacy-policy/">
      Privacy Policy
    </a>

    <a class="button secondary" href="https://raghd-dev.github.io/masar-terms-of-use/">
      Terms of Use
    </a>
  </div>

  <footer>
    © 2026 MASAR. All rights reserved.
  </footer>

</div>
```

  </main>
</body>
</html>
